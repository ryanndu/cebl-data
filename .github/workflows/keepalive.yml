name: Keepalive

# Keeps scheduled workflows enabled. GitHub disables scheduled workflows after
# 60 days without repository activity, and neither release-asset uploads nor
# commits made with GITHUB_TOKEN count as activity. This pushes an empty commit
# with a PAT (secret: KEEPALIVE_PAT) on the 1st of every month, year-round.

on:
  schedule:
    - cron: "0 0 1 * *" # 00:00 UTC on the 1st of every month
  workflow_dispatch: # Allows manual triggering

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.KEEPALIVE_PAT }}

      - name: Push empty commit
        run: |
          git config user.name "keepalive-bot"
          git config user.email "keepalive@users.noreply.github.com"
          git commit --allow-empty -m "keepalive: keep scheduled workflows enabled"
          git push
