[project]
name = "cebl-data"
version = "0.1.0"
description = "Scrapes CEBL game data and publishes it as GitHub Release assets."
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.0.5",
    "pygithub>=2.10.0",
    "pyjanitor>=0.32.24",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cebl_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
